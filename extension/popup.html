<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LikeBird 飞译</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="wordmark"><img class="brand-logo" src="icons/brand.png" width="256" height="118" alt="" /><img class="brand-type" src="icons/likebird-wordmark.svg" alt="LikeBird 飞译" /></div>
    <button id="settingsBtn" type="button" class="settings-button" aria-label="设置" title="设置"><i class="ui-icon icon-settings" aria-hidden="true"></i></button>
  </header>
  <main>
    <div class="current-page">
      <div>
        <h1>整页翻译</h1>
        <p id="siteDomain" class="domain">当前网页</p>
      </div>
      <span id="pageStatus" class="status" aria-live="polite"></span>
    </div>
    <p id="notice" role="status">正在读取 飞译设置…</p>
    <button class="secondary" id="retryPopup" type="button" hidden>重试</button>
    <div id="pageControls" hidden>
      <div class="translation-options">
        <label class="language" for="targetLang"><span>译为</span><span class="select-wrap"><select id="targetLang"></select></span></label>
        <fieldset class="display-modes" aria-label="译文显示方式">
          <label><input type="radio" name="displayMode" value="bilingual" /><span><i class="ui-icon icon-bilingual" aria-hidden="true"></i>双语对照</span></label>
          <label><input type="radio" name="displayMode" value="translation" /><span><i class="ui-icon icon-translation" aria-hidden="true"></i>仅译文</span></label>
        </fieldset>
        <label class="site-auto" id="siteAutoRow" hidden><span>自动翻译当前网站</span><input class="switch" id="siteAuto" type="checkbox" role="switch" /></label>
      </div>
      <div class="actions">
        <button class="primary" id="translateBtn" type="button">
          <i id="translateIcon" class="ui-icon icon-translate" aria-hidden="true"></i><span id="translateLabel">翻译此页</span><kbd id="translateShortcut" aria-hidden="true">⌥ A</kbd>
        </button>
        <button class="secondary" id="restoreBtn" type="button" hidden><i class="ui-icon icon-restore" aria-hidden="true"></i>显示原文</button>
      </div>
      <button class="text-button" id="retranslateBtn" type="button" hidden><i class="ui-icon icon-refresh" aria-hidden="true"></i>重新翻译</button>
    </div>
    <button class="primary" id="openSettings" type="button" hidden>连接翻译服务</button>
    <div class="selection-note" id="selectionNote" hidden>
      <div><strong><i class="ui-icon icon-selection" aria-hidden="true"></i>划词翻译</strong><p>选中文字，点击浮出的图标。</p></div>
      <kbd title="划词翻译快捷键">⌥ S</kbd>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
